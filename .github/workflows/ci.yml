name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release workflow can run these exact checks against the
  # tagged commit before it builds anything. Duplicating the steps there
  # instead would let the two drift, which defeats the point of the gate.
  workflow_call:

jobs:
  frontend:
    # Platform-agnostic (tsc + vite), so one cheap runner is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  rust:
    # Both platforms: the CLI bridge is full of `#[cfg(windows)]` / `#[cfg(unix)]`
    # branches, so a green Windows run says nothing about macOS — each side only
    # ever compiles half the file (and clippy only lints the half it compiles).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
