name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# This builds the signed Windows installers (NSIS + MSI) and macOS disk images
# (Apple Silicon + Intel), generates the updater's `latest.json`, and publishes
# them all to a GitHub Release. Installed apps poll that `latest.json` and
# self-update (see tauri.conf.json → plugins.updater).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password set when generating it
# Generate the keypair once with:  npx tauri signer generate -w soqlforge.key
# and paste the matching PUBLIC key into tauri.conf.json → plugins.updater.pubkey.
#
# Optional (macOS code signing + notarization — see DEPLOYMENT.md). Without
# these the .dmg still builds and installs, but Gatekeeper makes users take an
# extra step on first launch:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

on:
  push:
    tags:
      - "v*"

# tauri-action needs to create the release and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Serialized on purpose. Each job merges its platform into the shared
      # `latest.json` asset by download → merge → re-upload; running them in
      # parallel lets two jobs read the same base and the loser's platform
      # silently vanishes from the manifest.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.rust-targets }}

      - name: Install frontend deps
        run: npm ci

      # Signing is opt-in via secrets, and a missing or blank APPLE_CERTIFICATE
      # doesn't fail the build — it just produces an unsigned app, which nobody
      # notices until a user reports "SoqlForge is damaged". State the mode
      # up front so it's visible in the log, and catch the specific trap of a
      # certificate that's configured but unusable.
      - name: Determine macOS signing mode
        if: startsWith(matrix.platform, 'macos')
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_USER: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "expected=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE is unset or empty — building UNSIGNED. Users will hit Gatekeeper."
            exit 0
          fi
          # A blank secret and a truncated one look identical downstream; a real
          # base64'd Developer ID .p12 is a few KB.
          if ! printf '%s' "$CERT" | base64 --decode > /tmp/cert.p12 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not valid base64."
            exit 1
          fi
          SIZE=$(wc -c < /tmp/cert.p12 | tr -d ' ')
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::APPLE_CERTIFICATE decoded to $SIZE bytes — too small to be a .p12. Re-run the base64 step."
            exit 1
          fi
          # Check the PASSWORD, not whether openssl can decrypt the contents.
          #
          # Keychain Access exports .p12 files encrypted with RC2-40-CBC, which
          # OpenSSL 3 moved into its legacy provider — so `openssl pkcs12` fails
          # on a perfectly valid certificate with an "unsupported algorithm"
          # error that has nothing to do with the password. Only a MAC
          # verification failure actually means the password is wrong, and that
          # check runs before any content decryption, so it's reliable on every
          # openssl build. `security import` (what tauri-action uses to install
          # the cert) handles RC2 natively and is unaffected either way.
          CHECK=$(openssl pkcs12 -in /tmp/cert.p12 -noout -passin env:CERT_PASSWORD -legacy 2>&1) \
            || CHECK=$(openssl pkcs12 -in /tmp/cert.p12 -noout -passin env:CERT_PASSWORD 2>&1) \
            || true
          if printf '%s' "$CHECK" | grep -qi 'mac verify'; then
            echo "::error::APPLE_CERTIFICATE won't open with APPLE_CERTIFICATE_PASSWORD — one of the two is wrong."
            exit 1
          fi
          rm -f /tmp/cert.p12
          [ -n "$NOTARY_USER" ] || echo "::warning::APPLE_ID unset — the app will be signed but NOT notarized."
          echo "expected=signed" >> "$GITHUB_OUTPUT"
          echo "Certificate verified — building signed."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # All empty unless the optional Apple secrets above are configured,
          # in which case tauri-action signs and notarizes the .app/.dmg.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # ${__VERSION__} is filled from tauri.conf.json at build time.
          tagName: ${{ github.ref_name }}
          releaseName: "SoqlForge ${{ github.ref_name }}"
          # A multi-platform release ships ~9 assets; without a key, people
          # guess. Each job passes the same body — tauri-action sets it once
          # when it creates the release and leaves it alone afterwards.
          releaseBody: |
            Already installed? Nothing to do — the app updates itself.

            **Windows** — `SoqlForge_*_x64-setup.exe` (recommended) or
            `SoqlForge_*_x64_en-US.msi` for enterprise deployment.

            **macOS, Apple Silicon** (M1 and later) — `SoqlForge_*_aarch64.dmg`

            **macOS, Intel** — `SoqlForge_*_x64.dmg`

            Not sure which Mac you have? Apple menu → About This Mac. "Apple M…"
            means Apple Silicon.

            The `.sig` and `.tar.gz` files are for the auto-updater; you don't
            need to download them.
          # Held as a draft until every platform has landed — the updater
          # endpoint resolves to `releases/latest`, so publishing early would
          # briefly advertise a manifest that's missing half its platforms.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The pre-flight proves the certificate is good; this proves it was
      # actually applied. Without it a misconfiguration downstream of the
      # secrets still ships a silently unsigned .dmg to the release.
      - name: Verify the built app is signed
        if: startsWith(matrix.platform, 'macos') && steps.signing.outputs.expected == 'signed'
        run: |
          APP=$(find src-tauri/target -type d -name 'SoqlForge.app' -path '*/bundle/macos/*' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no SoqlForge.app found under src-tauri/target"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "::error::$APP is not correctly signed despite a verified certificate."
            exit 1
          fi
          codesign -dvv "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier)' || true
          # Gatekeeper's own verdict. Only passes once the notarization ticket
          # is stapled, so treat a failure as a warning — signing succeeded
          # either way, and notarization is separately optional.
          spctl --assess --type exec -vv "$APP" 2>&1 \
            || echo "::warning::Gatekeeper assessment failed — signed but likely not notarized."

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
