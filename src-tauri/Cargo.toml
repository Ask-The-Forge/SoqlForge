[package]
name = "soqlforge"
version = "0.4.0"
description = "SoqlForge — Salesforce SOQL desktop client"
authors = ["Ask the Forge"]
license = "MIT"
edition = "2021"

[lib]
name = "soqlforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "time", "io-util", "sync"] }
thiserror = "2"
which = "7"
regex = "1"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# The updater plugin is desktop-only (no mobile targets for this app, but keep
# the cfg gate so it never leaks into a mobile build).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Used to signal the `sf` process group on cancel (see cli::kill_tree).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
