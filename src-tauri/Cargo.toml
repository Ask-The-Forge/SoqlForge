[package]
name = "soqlforge"
version = "0.1.0"
description = "SoqlForge — Salesforce SOQL desktop client"
authors = ["Ask the Forge"]
license = "MIT"
edition = "2021"

[lib]
name = "soqlforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "time", "io-util", "sync"] }
thiserror = "2"
which = "7"
regex = "1"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
